<title>SPTeknik — Sedang Pemeliharaan</title>
<style>
  :root{
    --accent:#9A6F1A; --gold:#E2A817; --ink:#0a0a0a;
    --muted:rgba(0,0,0,.55); --line:rgba(0,0,0,.1);
    --sand:#f7f2e9; --sand-deep:#f0e9dc; --radius:20px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:'Host Grotesk',-apple-system,'Segoe UI',Roboto,sans-serif;
    color:var(--ink); background:
      repeating-radial-gradient(140% 110% at 50% -30%,
        rgba(0,0,0,0) 0px, rgba(0,0,0,0) 90px,
        rgba(0,0,0,.035) 170px, rgba(0,0,0,.035) 210px,
        rgba(0,0,0,0) 290px, rgba(255,255,255,.5) 400px, rgba(0,0,0,0) 460px),
      linear-gradient(225deg,#fff 0%,var(--sand-deep) 100%);
    padding:24px;
  }
  main{
    background:#fff; border:1px solid var(--line); border-radius:var(--radius);
    max-width:560px; width:100%; padding:56px 44px; text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,.06);
  }
  .logo{height:44px; width:auto; margin-bottom:28px}
  .badge{
    display:inline-flex; align-items:center; gap:8px;
    background:#161616; color:#fff;
    font-family:'Fragment Mono',ui-monospace,monospace;
    font-size:.66rem; text-transform:uppercase; letter-spacing:.12em;
    padding:7px 14px; border-radius:999px; margin-bottom:26px;
  }
  .badge .dot{width:8px;height:8px;border-radius:50%;background:#ff4444;animation:pulse 1.6s ease-out infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,68,68,.55)}70%{box-shadow:0 0 0 9px rgba(255,68,68,0)}100%{box-shadow:0 0 0 0 rgba(255,68,68,0)}}
  h1{font-size:2rem; letter-spacing:-.03em; margin:0 0 14px; line-height:1.15}
  h1 .serif{font-family:Georgia,'Times New Roman',serif; font-style:italic; font-weight:400; text-decoration:underline; text-decoration-color:var(--gold); text-decoration-thickness:2px; text-underline-offset:4px}
  p{color:var(--muted); margin:0 auto 34px; max-width:380px; line-height:1.6; font-size:.95rem}
  .btn{
    display:inline-flex; align-items:center; gap:10px;
    background:var(--accent); color:#fff; text-decoration:none;
    padding:14px 30px; border-radius:14px; font-weight:700; font-size:.95rem;
    box-shadow:0 3px 14px rgba(154,111,26,.26);
  }
  .btn:hover{filter:brightness(1.08)}
  .foot{
    margin-top:38px; font-family:'Fragment Mono',ui-monospace,monospace;
    font-size:.62rem; text-transform:uppercase; letter-spacing:.12em; color:rgba(0,0,0,.4);
  }
</style>
</head>
